[project]
name = "council-mcp"
version = "1.0.0rc4"
description = "MCP server for the `council` Claude Code plugin: delegate disjoint tasks to other providers' models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
council-mcp = "council_mcp.server:main"
council = "council_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "respx>=0.21", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["council_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["council_mcp"]
disallow_untyped_decorators = false  # MCPServer.tool() is untyped upstream
